# Constraint coverage inventory (issue #6, first deliverable). Descriptive, not a soundness claim,
# and not complete: it lists the elements named below, and `excluded` names the research directories
# it does not cover, with the reason. The checker fails if a research directory is neither cited nor
# excluded; for the shipped verifier, completeness rests on reading and on review.
#
# Each row maps one element of the relation that a FlashProve proof is about (an admitted operator,
# a range or rounding rule, a committed input or state, an output position) to the place in this
# repository that enforces it, and says what kind of enforcement that is:
#
#   proof_constraint     intended to be enforced inside the proof: a sub-proof's sumcheck, lookup,
#                        range check, or the hash chain itself. That the constraint is correct or
#                        sufficient is not established here.
#   verifier_validation  checked by the verifier program or the client's integration on public values,
#                        outside the proof's relation (parameter conditions, an ID comparison, a policy or
#                        range comparison with what the caller states); a complete proof of another
#                        statement passes the proof part and is stopped only here, if the caller states
#                        the right values
#   prover_only          done only by an honest committer or prover (cp_commit, cp_prove); nothing in a
#                        proof, key file or commitment shows a verifier that it happened
#   not_enforced         nothing in the repository enforces it; the proof says nothing about it
#
# scope: shipped (cp_verify, cp_commit, cp_prove, integrations/ on main) or research (the fork's operator
# prototypes under research/operators/, which are not in cp_verify).
#
# sites: file + symbol. `symbol` is a literal string of at least 12 characters that must occur in
# `file`. The checker (check_inventory.py, run in CI by claims-check) fails if a file is missing or a
# symbol no longer occurs in it, so a rename or deletion of a cited site is noticed. It does not see a
# row moved to a stronger kind, a check disabled behind unchanged text, or a row losing one of two
# sites. A site is where the enforcement lives, or, for prover_only and not_enforced rows, the place
# that documents the absence. A site says where; it does not show that the check there is right.
#
# Base: main ba1e3067f58b0142dd16a3df884626cfe6ccc585 for rows OP-01 .. OUT-07 (first version, PR #97
# head 655d70b2). Rows added after review (OP-15, OP-R8 .. OP-R14, RR-15 .. RR-21, RR-R1, RR-R2, IS-23, IS-24,
# OUT-08, OUT-09) were read at main 0bdf8326, where the cited files are unchanged from ba1e3067. Read
# from source and docs; only rows N1 to N3 of experiments/20261110-6-coverage-inventory/ were run.
# Rows OP-R15, OP-R16, RR-R3, RR-R4, IS-25 .. IS-27 (research/operators/qwen_conv_history, PR #101) were
# read at main 8d579337 from the code and experiments/20261111-35-conv-history-binding/RESULTS.md; nothing
# was rerun for them.
# Row OP-R17 (research/operators/qwen_ops_followups, PR #115, issue #94) was read at main 7c40dd9f from the
# code and experiments/20261111-94-op-followups/RESULTS.md.

