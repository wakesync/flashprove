# Research directories under research/operators/ that no row covers, with the reason. The checker fails
# if a directory there is neither cited by a row nor listed here, so a new prototype cannot land unseen.
excluded:
  - path: research/operators/evidence
    reason: "receipts of the first top-k prototype (OP-R7), no relation of its own"
  - path: research/operators/public_binding
    reason: "public-coordinate product proof, a substrate of affine_rows (OP-R1); its own coordinate relation is not inventoried row by row"
  - path: research/operators/shared_wires
    reason: "shared-wire equality proof, a substrate of affine_rows (OP-R1) and the GLM slices; not inventoried row by row"
  - path: research/operators/qwen_deltanet
    reason: "Qwen DeltaNet M1, superseded by the M1b lookup prototype (OP-R4); its M1 verdict is FAIL as registered; not inventoried"
  - path: research/operators/qwen_m3
    reason: "counting and cost model, no proof and no relation that enforces anything"
  - path: research/operators/qwen_deltanet_m2_build
    reason: "reached main after this inventory's base (PR #73, main 0bdf8326); its two-lookup relations are not inventoried here (follow-up)"
  - path: research/operators/qwen_handoff
    reason: "reached main after the repair run (PR #98, main 2c180575); its joint two-chunk boundary relations are not inventoried here (follow-up). Verifier-side statement substitution, foreign transcript domain, malformed proofs and state-prefix cases on it are tested in experiments/20261111-6-substitution-suite (PR #108), without inventory rows"

# Open gaps: every prover_only and not_enforced row, plus open proof obligations, in plain language.
# check_inventory.py fails if a prover_only or not_enforced row is in no gap.
open_gaps:
  - id: G-01
    rows: [IS-02, RR-13]
    text: "A commitment says nothing about which model it is. Nothing ties the committed integers to a publisher's checkpoint or to an honest conversion of it. A client must trust whoever tells it the ID belongs to a model."
  - id: G-02
    rows: [RR-11, RR-12]
    text: "Whether every prompt keeps the model inside its ranges is checked only by the honest committer. If a value leaves the provers' range the honest prover answers 'failed', and the client cannot tell that from a false claim."
  - id: G-03
    rows: [IS-11, IS-18, IS-12]
    text: "Weight hiding rests on the honest prover: it counts opened columns, draws fresh seeds and keeps masks. A verifier cannot see a lost mask, a reused seed, a public-weights commitment or an over-used leaf table."
  - id: G-04
    rows: [IS-13, IS-14, IS-15, OUT-04, OUT-08]
    text: "The proof is about token ids. Who chose the prompt tokens, which tokenizer and template made them, how the reply was sampled and what the prompt says are all outside the proof. Tokens up to r are not checked at all, and neither are tokens after e when e < T."
  - id: G-05
    rows: [IS-16, IS-17]
    text: "A proof names no client and no time, so it can be replayed. The verifier binary is not identified in the transcript, so a client must build its own."
  - id: G-06
    rows: [IS-19]
    text: "The scale file is bound by the ID, but a scale file inside the admitted ranges can still switch parts of the model off. The verifier checks ranges, not meaning."
  - id: G-07
    rows: [OP-R5, OP-R6, OP-R7, OP-R9, IS-22, IS-24, OP-R16, IS-27]
    text: "Research operators are not model coverage: the M2 admission rule has no implementation, the Qwen operator proofs bind no particular weights or history, the first top-k prototype has no proof, the GLM algebra slice has no rounding or ranges, the GLM slices take their initial state as given, and the state-commit harness accepts replaced token inputs by design. The conv carried-history prototype (issue #35) binds history continuity only: its kernel and new inputs are still free, its genesis root is trusted as given, and its history is public, not hidden."
  - id: G-OB1
    rows: [RR-04, RR-08]
    text: "Open obligation: that cp_verify's no-overflow conditions are enough for the programs' equations to hold over the integers is argued from reading the source and a non-public report, not proved."
  - id: G-OB2
    rows: [IS-01, IS-08, OUT-05, OUT-06, OUT-09]
    text: "Open obligation: the stronger claim the client wants (this commitment, this policy, this whole range, a complete reply, this next token) is enforced only if the caller states each value itself. A bare cp_verify YES on files that came with the proof can be a true answer to a weaker question. End-to-end exact greedy needs all five checks on the client side."
  - id: G-OB3
    rows: [OP-01, OP-05, OP-14, RR-03]
    text: "Open obligation: the Lean soundness theorem is about the Lean verifier at full size and exact match; the C++ verifier is tested against it, not proved, and no theorem covers new research gadgets at their own dimensions."
  - id: G-08
    rows: [OP-R18]
    text: "The q/k RMSNorm prototype (issue #35) proves the norm of the inputs and gains it is given; nothing ties those inputs to a projection of a model's hidden state or the gains to a model's norm weights."
