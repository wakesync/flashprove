  - id: qwen-norm-scaling-layer0
    title: "Qwen3.8-27B real weights, layer 0: candidate integer lowerings of the head output and norm"
    status: negative
    status_note: (exploratory, standards gaps)
    replication: unreplicated
    pr: 74
    summary: "Exploratory on two standards points (PREREG has no Hypothesis section; the registration commit also adds a read-only prelook script), numbers unchanged. Registered result: the PR 68 F = 12 baseline reproduced exactly (960 of 960 rows) at its BLAS thread setting. Everything else was obtained under a protocol deviation (a registered stop rule moved while queued): no registered candidate passes; the best one inside its stated honest classes (C4P) reaches median per-head rel_y 0.0293 (max 3.64) against 0.01 and 0.05, from 0.659 for the M2 baseline (C3P at 0.0294 under the registered rounding, where the rule's pick moves from C4P by 0.0001); round half up, not the 2^18 gates, gives most of that gain; two individually sufficient error sources that compound, the floor of the head output and the floor of the state update. The candidates are numerical lowerings, not sound proof-ready ones (local norm aliases under their counted widths; X3 exceeds its counted limbs)"
