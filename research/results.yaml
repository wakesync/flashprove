# Single source of truth for the README "Fork status & results" table.
#
#   python3 scripts/update-results.py          # validate, then rewrite the README block
#   python3 scripts/update-results.py --check  # validate; exit 1 if the README is stale
#
# Every result PR adds or edits an entry here and reruns the script. The reviewer
# checks each metric against its `source` file at its `commit`.
#
# Schema (version 1). Prose fields render the README row. `metrics` is the
# machine-readable part, meant for plotting later; nothing renders it today.
#
#   results[]:
#     id          stable slug
#     title       README "Result" cell
#     status      reproduced | measured | negative | in progress | done
#     status_note optional text appended in the Status cell, e.g. "(held)"
#     pr          PR number that put the evidence on main, or null
#     summary     README "Key number" cell (prose)
#     conditions  README "n + conditions" cell (prose)
#     evidence    list of repo paths; the first is the README link
#     evidence_note optional text after the link
#     metrics[]:
#       name      stable slug, unique within the result
#       series    optional: groups metrics that belong on one chart
#       arm       optional: which side of a comparison (e.g. stock, candidate)
#       stat      single | median | mean | max | count
#       value     number
#       unit      s | B | MiB | USD | count | exit_code | abs_diff
#       total     optional: denominator for count metrics (e.g. 10 of 10)
#       n         number of independent observations behind `value`
#       spread    null, or {sd, min, max} (any may be null), or {resolution}
#       hardware  key into `hardware` below
#       date      YYYY-MM-DD (UTC) of the evidence commit
#       commit    full SHA of the commit that added the source on main's history
#       source    repo path holding the raw number (or "commit-message")
#       note      optional caveat that a chart caption must carry

schema_version: 1

