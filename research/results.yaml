    status: measured
    replication: unreplicated
    pr: 114
    summary: "FAIL against the registered threshold on every arm. Lowering L (exact remainder range, quotient range tied to the 2^18 contract, committed squared norms of k and q) gives 0 second witnesses on every registered floor at GB = 12 and 18, C = 16 and 64 (the #71 M1b window gives a second witness for every M and o floor at GB = 18 on the same floors). GB = 12: proved M and o numerator bounds 59 and 61 bits fit Goldilocks, but honest completeness is 19 of 20 runs (one delta leaves the single-cell window). GB = 18: the witness is still unique (window 42 + 19 = 61 bits), but the proved (sufficient) M and o bounds of 65 and 67 bits fail the registered no-wrap budget, so the kill criterion applies; this does not show an admitted trace reaches them. Counted, not measured: L adds 321.5 (C = 16) and 297.5 (C = 64) committed values per head per token over the #71 SB formula at D = 32. SB is still not sound end to end, not built and not recommended"
