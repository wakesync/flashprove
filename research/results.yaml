  - id: client-envelope-9
    title: "Versioned client envelope and fail-closed client verifier around cp_verify, 41 committed vectors (issue #9)"
    status: "measured"
    replication: "unreplicated"
    pr: 122
    summary: "PASS vs prereg: 35 of 35 reject vectors (substitution, duplicate/unknown field, non-canonical, downgrade, cross-request replay, truncation, state rollback, wrong end token, interleaving, expiry, signature) refused before release at the registered check in 5 of 5 runs (175/175 steps), 0 released, state untouched; 6 of 6 accept vectors released (35/35 steps), incl. the registered expected-accept gap A5 (same proof re-wrapped under a new nonce: the proof binds no nonce, G-05). 32 of 35 refusals are client-side application checks before any proof runs; 3 are cp_verify NO. cp_verify on released steps median 1.430 s, client overhead median 0.014 s (diagnostic). Registered numbers measured on the pre-fix client at fb63aa8 and they stand as such. That client was unsafe for concurrent processes sharing a state file (double release, lost consumption; found in review, not covered by the sequential registered vectors) and consumed the nonce on a release-file error; fixed after the run (PREREG amendment 2). Post-registration checks, no threshold: the 41 vectors re-run on the fixed client give the same verdict on all 210 steps, and the concurrency/output-failure tests pass 20/20 per concurrent case on the fixed client and fail on the pre-fix one. A second review round found that a symlink or hard-link alias of the state file still released one nonce twice; fixed after it too (lock and rename on the real path, hard-linked state refused), and the alias tests pass 20/20 per case on the second-fix client (at most one release per nonce) and fail on the c715045e client for symlink and hard-link aliases"
    conditions: "examples/accepted-proof and accepted-proof-clipped-gap as proof payloads, client builds the request file itself; TEST ed25519 keys from public labels; tokenizer/template/provenance digests are TEST pins (synthetic model, no tokenizer); MOCK attestation only, no TEE verified; cp_verify -j 1, CPUs 13-15 of a shared loaded VM; software only, no network, no real provider; gaps not checked: G-03 (batch envelopes, mask exhaustion), G-04 (tokenizer, template and checkpoint identity are pins, not bound by the relation), G-05 (the proof binds no nonce); registered vectors are sequential, concurrency tested only after the run on one local filesystem; advisory lock, not tested on network filesystems or under power loss; bind mounts not covered"
    evidence: ["experiments/20261111-9-client-envelope/RESULTS.md", "research/envelope/SPEC.md", "research/envelope/README.md"]
