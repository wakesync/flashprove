  - id: qwen-qk-rmsnorm
    title: "Per-head q/k RMSNorm (epsilon, learned gain) as proof constraints, bounded CPU prototype"
    status: "measured"
    status_note: "research only; inputs and gains are public statement fields with no provenance (not tied to a projection or to model norm weights)"
    replication: "unreplicated"
    pr: 109
    summary: "PASS vs prereg: exact isqrt and division with range-checked residuals, per-channel gain and epsilon in the relation, 2 q heads + 1 k head per proof at D16 and D256; honest 100/100, hostile 420/420 (240 complete malicious proofs) in release and UBSan builds; fixed-point error vs float64 at most 2e-3 relative L2 per head, zero heads exact"
    conditions: "F = 12, synthetic inputs (uniform, outlier, low, unit-spike, zero), seeds 1..10, CPU shared loaded host, research target 10 bits per round incl. 6 bits proof-of-work, toy coins, no whole-proof soundness figure; sampled hostile classes; not composed with projection, rotary or attention; not in cp_verify"
