  - id: qwen-hidden-root-handoff
    title: "DeltaNet window handoff with an in-proof boundary commitment (hidden initial root)"
    status: "measured"
    status_note: "research prototype; unvetted sponge; not zero-knowledge"
    replication: "unreplicated"
    pr: 123
    summary: "PASS vs prereg: each window proof opens an in-field sponge commitment of its incoming state/history inside the proof and outputs the next one; verifier never gets a boundary state. 15/15 honest windows and 5/5 honest 3-window chains accepted; 13 named negatives x 5 seeds rejected (truncated chain by the verifier-held window count, outside the arithmetic). Hash is 88.7% of columns at D8/C2."
    conditions: "Five synthetic seeds, one head, D8/F12, C2 tokens per window, N3 windows, shared CPU. Poseidon-shaped sponge (w12 x^7 8+22) with this lane's own constants, no cryptanalysis; binding assumed, not shown. Toy coins (target 10, work 6), no soundness level. Not zero-knowledge. The initial root R0 comes from the trusted test harness (R0 provenance not covered). Chain length N is checked by the verifier outside the arithmetic, no recursion. Synthetic model/weights labels. D32/D128 counted, not built."
    evidence: ["experiments/20261111-93-hidden-root-handoff/RESULTS.md", "research/operators/qwen_hidden_root/README.md"]
