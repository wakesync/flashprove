  - id: ref-divergence-ops
    title: "BF16 and FP8 (E4M3) reference definitions; PR #67 integer operator relations vs each reference, per operator"
    status: "measured"
    status_note: "weak rule by construction; FP8 arm close to vacuous, see RESULTS section 3"
    replication: "unreplicated"
    pr: 110
    summary: "PASS vs prereg in all 6 cells (BF16 and FP8, F = 12 / 14 / 16): 50 / 50 held-out checks each of R_max = max|int - ref| / max|ref - fp64| <= 2 over 10 ops x 5 runs. Worst BF16 R_max 1.55 (l2, F12), worst FP8 1.04. Since R_max <= 1 + int error / ref error, this says the committed integer relations are not a worse approximation than BF16 on these inputs; FP8 E4M3 error is 12 to 117x the integer error at F12, so the FP8 PASS carries little information. Stress inputs outside the integer domain: BF16 15 / 50, R_max up to 337 (clamps)"
    conditions: "synthetic Gaussian inputs inside the integer domain, splits frozen by hash before evaluation (calibration seeds 1..5 set FP8 per-op delayed scales, held-out 1001..1005 decide, stress 2001..2005 descriptive); references emulated in numpy (BF16 RNE / FP8 E4M3 RNE satfinite, FP32 compute, sequential FP32 sums); PR #67 bounded relations only (no epsilon, no M2 norm, no DeltaNet, no matmul), no weights, no model, no proof, CPU"
