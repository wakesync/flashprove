  - id: h200-memory-lever
    title: "Larger-memory GPU test at full size, synthetic weights: in-step 12 on an H200 vs in-step 6 on an H100, with a desk fact-check of a public cost teardown (PR #44)"
    status: negative
    status_note: "(below registered n: 1 session per arm; control box off baseline, -14%; two different hosts; rental 1 data after 02:33 UTC lost)"
    replication: unreplicated
    pr: 44
    summary: "the lever bar is met as computed but the lever is NOT supported: 24,576 / median batch interval gives 146.09 (H200, in-step 12) vs 93.91 tok/s (H100, in-step 6) = 1.556x against a 1.15x bar, per-interval ranges disjoint, but the two arms ran on two different hosts, one session each, and the H100 control is off baseline (14% below upstream's 109.09; its full-size commit took 1:00:19 against 28:33 on the H200 box), so GPU memory and host speed are confounded and the effect is not identifiable in this design (no supported improvement, not evidence of no effect); cost FAILS: $10.53 per Mtok on the H200 vs $7.13 per Mtok on one H100 GPU at the rented prices; observed: `-in-step 12` at batch 24 ran on the H200 with a sampled GPU memory peak of 87,237 MiB, above the H100's 81,559 MiB total, so it probably does not fit an H100 (inference; no committed file shows it run or fail on an H100). Rental 1 figures are run-log text with no surviving files and support no conclusion. The teardown fact-check (research/efficiency/README.md sections 1 to 3) is desk work on upstream's published figures, not a measurement"
    conditions: "n = 1 session per arm (registered: 2), 4 batch intervals each, successive batches of one process and not independent runs; batch 24, 1,024-token windows, synthetic weights (`made-up-blocks`, target_full_f2, `-M 1`), build pin `29907e5f`; both sessions bound to 23 CPUs of the GPU's NUMA node; two marketplace hosts with different CPUs, so GPU memory and host speed cannot be separated; in-step 6 on the H200 not run in this rental; 120 of 120 proofs accepted by cp_verify in each session; $ per Mtok calculated from the rented $/h (one H100 GPU = half of the 2-GPU box price); not a headline"
