  - id: coverage-inventory-6
    title: "Constraint coverage inventory of main, with a site checker and three negative tests (issue #6, PR #97)"
    status: measured
    replication: unreplicated
    pr: 97
    summary: "Descriptive, not a soundness result, and not complete: 85 rows (operators, range/rounding rules, committed inputs/state, output positions) mapped to 154 cited code sites, which a checker (run in CI) verifies still exist and which pins the open obligations; 48 intended proof constraints, 16 verifier or client validations, 4 prover-only, 17 not enforced (all 21 listed as open gaps); research directories not inventoried are listed with a reason (6 at the repair run, 7 after main brought qwen_handoff). Complete honest proofs of another commitment, policy or checked range: 20 of 20 rejected by the intended application check, 15 of 15 controls accepted; on the narrower range cp_verify alone says YES 5 of 5, only the client range comparison rejects. Negative-test numbers are from the repair run registered after review (scripts committed before it); the first run gave the same counts. Inventory counts are from the round-2 receipt (RR-R1 split into conv/norm/rotary and nonlinear ranges)"
    conditions: "inventory by reading source and docs at main ba1e3067 (rows added after review read at 0bdf8326), one lane plus two reviews, rows sampled not all checked by reviewers; negative tests on the two stored synthetic examples (accepted-proof, accepted-proof-clipped-gap), 5 alternating repetitions per arm, cp_verify -j 1 on CPUs 0-5 of a shared loaded VM; no forged proof built, so no proof-constraint row is tested"
