  - id: fs-grinding-weakest-round-95
    title: "Grinding the weakest Fiat-Shamir positions round, research conv profile (issue #95)"
    status: "measured"
    status_note: "one attack on one round of one research profile; no whole-proof or security-level figure"
    replication: "unreplicated"
    pr: 113
    summary: "PASS vs prereg: grinding the library's own hash chain at the round with the largest error before work (BASE, 9 positions of 512, bound 2^-4.30, 6 work bits) gave forge rates per completed try of 0.049846 (nonce grinding, 24923/500000, 99% CP [0.049057, 0.050644]) and 0.049728 (message grinding, 24864/500000, [0.048939, 0.050525]) against the uniform-draw figure 0.049953 for a modelled agreeing set; about 1284 nonce tests (work-test calls) per successful draw vs 2^6/p0 = 1281 expected (20.1 vs 20.0 without work), counting work-test calls only, not challenge expansion (2 extra chain calls per completed w=6 try, 1 at w=0) or message-prefix hashing, so the 64x applies to the counted work-test cost only. Grinding bought nothing beyond paying for more tries on this round"
    conditions: "research/operators/qwen_ops conv, F=12, fixture seed 1, research target 10 bits, 6 work bits on QUERY rounds; cheating word modelled from the plan's own bound, not constructed; synthetic chain prefix with random prover message words of the planned length (1590 words, 12720 bytes, regenerated every try in arms B/C instead of the registered 32-byte message: a deviation recorded in a retrospective PREREG amendment); 3 arms x 5 seeds x 100000 tries, CPU, shared loaded host; a forge is one round's draw, not an accepting proof; other rounds, earlier-round steering, closeness rounds and the 128-bit setting not tried"
    evidence: ["experiments/20261111-95-fs-grinding/RESULTS.md", "experiments/20261111-95-fs-grinding/README.md"]
    metrics:
      - {"name": "forges_A", "series": "fs-grinding-95", "arm": "A", "stat": "count", "value": 24923, "unit": "count", "n": 5, "spread": null, "hardware": "cpu-epyc-rome-kvm-16", "date": "2026-11-11", "commit": "9e172eb41e107d3fa32713d7d06c48fbd524e201", "source": "experiments/20261111-95-fs-grinding/runs/summary.json", "note": "Measured, unreplicated; research conv profile of PR #67 (F12, target 10, work 6), round BASE (last stage), t=9, n=512, modelled agreeing set A=367 (p0=0.049953, bound e=2^-4.300); synthetic transcript prefix; not a whole-proof figure, not a security level. nonce grinding; pooled over 5 runs x 100000 tries; 99% Clopper-Pearson [0.049057, 0.050644].", "total": 500000}
