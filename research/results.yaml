  - id: qwen-deltanet-m2-design
    title: "Qwen DeltaNet M2 design: verifier-side admission, lookup-exact remainders, whole-head ranges (PR #66)"
    status: measured
    replication: unreplicated
    pr: 66
    summary: "PASS vs prereg (GO for an M2 build, arm B). Registered run, first prototype: a verifier entry that admits its own integer public inputs accepted 10 of 10 honest M1b proofs (+0.18 s on a 7.6 s verify) and rejected 34 of 34 hostile encodings, including the #63 review's R9 that the caller path accepts. The prototype as it is now (conv history words, witness-free checked derivation) reran 10 of 10 honest and 44 of 44 hostile cases at the expected stage, also under UBSan. Counted, not built: lookup-exact remainders cut product columns per state cell per token 17.4 to 6.1 and relations 3.7x, so the M2 head at T = 16 fits 2^21; whole-head ranges fit 20 of 20. A third review requested changes: the design did not make the verifier check a bound its norm argument needs (22 reported alias cases, reproduced in a script of the design equations). The design now requires rejecting out-of-class derived coefficients; that rule is specified and exercised in a script only, no verifier implements it, and a re-review is pending"
    conditions: "design lane, no M2 proof, and M2 as designed is a rehearsal (all inputs public); admission prototype on the M1b statement (one head, T = 4), which has no norm and no recompute stage; every metric below is the registered run at the first prototype's commit, the reruns of the current prototype are in RESULTS.md and are not metrics here; counts from a model that reproduces M1/M1b exactly, norm term counts are for one stated lowering and unchecked by a builder; ranges from an integer reference with synthetic init at gain 1; research security (target 10 bits), CPU 6 cores, shared loaded VM"
