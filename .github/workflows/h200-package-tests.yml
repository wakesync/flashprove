# CPU-only tests of the undeployed H200 package (research/gpu/tinfoil-h200/): the results server's
# routes and file boundary (serve_test.py), the job runner's control flow with mocked GPU programs
# (run_job_test.py), bash -n and shellcheck. No GPU, no secrets, no network calls beyond checkout.
name: h200-package-tests

on:
  pull_request:
    paths:
      - "research/gpu/tinfoil-h200/**"
      - ".github/workflows/h200-package-tests.yml"
  push:
    branches: [main]
    paths:
      - "research/gpu/tinfoil-h200/**"

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: bash -n and shellcheck
        working-directory: research/gpu/tinfoil-h200
        run: bash -n run_job.sh && shellcheck --version && shellcheck run_job.sh
      - name: serve_test.py
        working-directory: research/gpu/tinfoil-h200
        run: python3 serve_test.py
      - name: run_job_test.py
        working-directory: research/gpu/tinfoil-h200
        run: python3 run_job_test.py
